csv_info = Um Benutzer über eine CSV-Datei anzulegen, muss eine Liste an Benutzern im folgenden Format bereitgestellt \
  werden: Benutzername (1. Spalte), E-Mail-Adresse (2. Spalte) und Sprache (3. Spalte, Werte "ENGLISH" oder "GERMAN"). \
  Fehlt die Sprachspalte, wird englisch als Standardsprache für die Benutzer festgelegt. Optional können auch \
  Passwörter für Benutzer in einer separaten Spalte spezifiziert werden. Die Datei muss die Spaltennamen "username", \
  "email", "language" und "password" enthalten. Fehlt die Passwortspalte, werden Passwörter automatisch angelegt und \
  in einer weiteren CSV-Datei gespeichert.
csv_info_no_mail = Um Benutzer über eine CSV-Datei anzulegen, muss eine Liste an Benutzern im folgenden Format \
  bereitgestellt werden: Benutzername (1. Spalte) und Sprache (2. Spalte, Werte "ENGLISH" oder "GERMAN"). Fehlt die \
  Sprachspalte, wird englisch als Standardsprache für die Benutzer festgelegt. Optional können auch Passwörter für \
  Benutzer in einer separaten Spalte spezifiziert werden. Die Datei muss die Spaltennamen "username", "language" und \
  "password" enthalten. Fehlt die Passwortspalte, werden Passwörter automatisch angelegt und in einer weiteren \
