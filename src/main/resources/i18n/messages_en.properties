# 'Add users from CSV' page
csv_create = Create Users from CSV
csv_info = To add users through a CSV file, please provide a list of users in the following format: username (1st \
  column), email address (2nd column) and language (3rd column, values "ENGLISH" or "GERMAN"). If the language column \
  is missing, English will be set as the user's default language. Optionally, passwords can be specified for each user \
  in a separate column. The file must contain a header line with "username", "email", "language" and "password" as  \
  column names. If the password column is missing, passwords will be generated automatically and saved in an \
  additional CSV file.
csv_info_no_mail = To add users through a CSV file, please provide a list of users in the following format: username \
  (1st column) and language (2nd column, values "ENGLISH" or "GERMAN"). If the language column is missing, English \
  will be set as the user's default language. Optionally, passwords can be specified for each user in a separate \
  column. The file must contain a header line with "username", "language" and "password" as column names. If the \
  password column is missing, passwords will be generated automatically and saved in an additional CSV file.
