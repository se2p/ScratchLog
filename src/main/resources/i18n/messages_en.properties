# Index page
project_info = This project uses an instrumented Scratch IDE to record program construction sequences and \
  make an evaluation of the programming process possible. Following an IDE-based learning analytics approach, \
  evaluating the procured data allows personalized feedback for the individual student and can thus help to improve \
  programming education at all skill levels.
reset_info = We have tried to send an email to the specified address. Please check your mail account to complete the \
  operation. If you have not received any email, the username or email address you specified might have been incorrect.
course_heading = Courses
course_detailed_description = Courses allow managing multiple related sessions. In a course, multiple course sessions \
  can be added, which automatically makes every participant of the course a participant of the course sessions.
experiment_heading = Sessions
experiment_detailed_description = A session represents a programming task that can be worked on by the session \
  participants. For every session, an initial Scratch project can be uploaded as a starting point for the \
  implementations of the participants. The progress and results of the participants are recorded, so they can be \
  analyzed and downloaded. A session can be part of a course, but can also be created without a connection to a course.

