<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{experiment_finish_title}"></title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Navigation bar -->
<header th:insert="~{header :: header}"></header>

<!-- Page content -->
<div class="container mt-4 mb-4">
    <div class="card p-5">
        <div class="bg-holder d-none d-md-block bg-card"
             style="background-image:url(/img/corner-4.png);">
        </div>

        <div class="text-center">
            <!-- Experiment finished title -->
            <h2 class="mb-5" th:text="#{finished_experiment}"></h2>

            <!-- Thank you message -->
            <div class="mb-3" th:text="${thanks}"></div>

            <!-- Restart button -->
            <a class="btn btn-secondary mt-3" th:text="#{restart}" style="z-index: 1"
               th:href="@{/participant/restart(user=${user}, experiment=${experiment}, secret=${secret})}">
            </a>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:insert="~{footer :: footer}"></div>
</body>
</html>
