<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{course_title}"></title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Navigation bar -->
<header th:insert="~{header :: header}"></header>

<!-- Page content -->
<div class="container mt-4 mb-4" sec:authorize="hasRole('PARTICIPANT')">
    <div class="card p-5 pb-2">
        <!-- Background Image -->
        <div class="bg-holder d-none d-md-block bg-card"
             style="background-image:url(/img/corner-4.png)">
        </div>

        <!-- The course title along with edit and delete buttons. -->
        <div class="d-flex justify-content-between flex-wrap mb-4" style="z-index: 1;">
            <!-- The course title. -->
            <h1 class="mb-3 h2" th:text="${courseDTO.title}"></h1>

            <!-- Actions Dropdown for Admins -->
            <div sec:authorize="hasRole('ADMIN')">
                <a id="open" class="btn btn-primary" th:unless="${courseDTO.active}"
                   th:text="#{start_course}"
                   th:href="@{/course/status(id=${courseDTO.id}, stat='open')}"></a>
                <input id="openStopCourseModal" class="btn btn-danger" th:if="${courseDTO.active}"
                       th:value="#{stop_course}"
                       style="z-index: 1">
                <div class="dropdown" style="float: right; left: 10px;">
                    <a class="btn btn-special dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false" th:text="#{actions}">
                    </a>
                    <ul class="dropdown-menu z-2">
                        <li>
                            <a class="dropdown-item" th:href="@{/course/edit(id=${courseDTO.id})}" th:text="#{edit}"></a>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <a id="openDeleteCourseModal" class="dropdown-item text-danger" style="cursor: pointer;"
                               th:text="#{delete}"></a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- The course description. -->
        <div class="row z-0">
            <div class="col-12 mb-5" th:text="${courseDTO.description}"></div>
        </div>

        <!-- Dashboard Link and Course Controls. -->
        <div class="row mb-5" sec:authorize="hasRole('ADMIN')">
            <div class="col-12 d-flex justify-content-between align-items-center flex-wrap">
                <!-- Course Status -->
                <div class="d-flex align-items-center gap-3" style="z-index: 1;">
                    <div class="p-3 bg-light border rounded" style="min-width: 150px;">
                        <h6 class="mb-1">
                            <i th:class="${courseDTO.active ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-danger'}"></i>
                            <span th:text="#{status}"></span>
                        </h6>
                        <p class="mb-0">
                            <span th:if="${courseDTO.active}" th:text="#{opened}" class="text-success fw-bold"></span>
                            <span th:unless="${courseDTO.active}" th:text="#{closed}" class="text-danger fw-bold"></span>
                        </p>
                    </div>
                </div>

                <!-- Last Changed Timestamp -->
                <div class="p-3 bg-light border rounded" style="min-width: 150px;">
                    <h6 class="mb-1">
                        <i class="fas fa-clock text-muted"></i>
                        <span th:text="#{last_changed}"></span>
                    </h6>
                    <p class="mb-0 text-muted" th:text="${courseDTO.lastChanged}"></p>
                </div>
            </div>
        </div>


        <!-- The error message shown when entering an invalid password. -->
        <div class="row" th:if="${param.invalid != null}" style="z-index: 1;">
            <div class="col-12 alert alert-danger" th:text="#{invalid_password}"></div>
        </div>

        <!-- The error message shown when an error occurs. -->
        <div class="row" th:if="${error != null}" style="z-index: 1;">
            <div class="col-12 alert alert-danger" th:text="${error}"></div>
        </div>

    </div>

    <!-- The table of participants in the course and the buttons for adding and removing participants. -->
    <div class="card mt-5" th:fragment="course_participant_table" id="course_participant_table"
         sec:authorize="hasRole('ADMIN')">
        <div class="card-header">
            <h5 class="mb-0" th:text="#{heading_participants}"></h5>
            <div class="dropdown" th:if="${courseDTO.isActive()}">
                <a class="btn btn-special dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                   aria-expanded="false" th:text="#{actions}">
                </a>

                <ul class="dropdown-menu" style="z-index: 2;">
                    <li>
                        <a class="dropdown-item" id="openAddParticipantModal" th:text="#{add_existing}"
                           style="cursor: pointer"></a>
                    </li>
                    <li>
                        <a class="dropdown-item" id="openAddParticipantsCsvModal" th:text="#{add_csv_participants}"
                           style="cursor: pointer"></a>
                    </li>
                    <li th:unless="${participants.isEmpty()}">
                        <hr class="dropdown-divider">
                    </li>
                    <li th:unless="${participants.isEmpty()}">
                        <a class="dropdown-item text-danger" id="openDeleteParticipantModal"
                           th:text="#{delete_participant}" style="cursor: pointer"></a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- The table containing the participant information. -->
        <div class="card-body">
            <table class="table table-hover participants-table">
                <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col" th:text="#{username}"></th>
                    <th class="text-center" scope="col" th:text="#{added}"></th>
                </tr>
                </thead>
                <tbody th:if="${participants.isEmpty()}">
                <tr>
                    <td colspan="3" th:text="#{table_empty}"></td>
                </tr>
                </tbody>
                <tbody th:unless="${participants.isEmpty()}">
                <tr th:each="participant : ${participants}">
                    <th scope="row">
                        <!--suppress ThymeleafVariablesResolveInspection -->
                        <a class="no_decoration" th:href="@{/users/profile(name=${participant.user.username})}"
                           th:text="${participant.user.id}"></a>
                    </th>
                    <td>
                        <!--suppress ThymeleafVariablesResolveInspection -->
                        <a class="no_decoration" th:href="@{/users/profile(name=${participant.user.username})}"
                           th:text="${participant.user.username}"></a>
                    </td>
                    <td class="text-center">
                        <!--suppress ThymeleafVariablesResolveInspection -->
                        <span th:text="${participant.added.toLocalDate()}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
            <!-- The navigation elements below the table. -->
            <div class="text-center">
                <a id="participantsFirst" class="btn btn-outline-dark"
                   th:style="${participantPage <= 0 ? 'display:none' : ''}" th:aria-label="#{first_page_label}">
                    <i aria-hidden="true" class="fas fa-angle-double-left"></i>
                </a>
                <a id="participantsPrev" class="btn btn-outline-dark"
                   th:style="${participantPage <= 0 ? 'display:none' : ''}" th:aria-label="#{previous_page_label}">
                    <i aria-hidden="true" class="fas fa-angle-left"></i>
                </a>
                <a id="participantsNext" class="btn btn-outline-dark"
                   th:style="${participantPage >= lastParticipantPage ? 'display:none' : ''}"
                   th:aria-label="#{next_page_label}">
                    <i aria-hidden="true" class="fas fa-angle-right"></i>
                </a>
                <a id="participantsLast" class="btn btn-outline-dark"
                   th:style="${participantPage >= lastParticipantPage ? 'display:none' : ''}"
                   th:aria-label="#{last_page_label}">
                    <i aria-hidden="true" class="fas fa-angle-double-right"></i>
                </a>
            </div>

            <!-- Let Thymeleaf fetch the current and the last participant page numbers. -->
            <script>
                var participantPage = [[${participantPage}]];
                var lastParticipantPage = [[${lastParticipantPage}]];
            </script>
        </div>
    </div>

    <!-- The experiment table containing experiments that are part of this course. -->
    <div class="card mt-5" th:fragment="course_experiment_table" id="course_experiment_table">
        <div class="card-header">
            <h5 class="mb-0" th:text="#{experiment_heading}"></h5>
        </div>

        <!-- The table containing the experiment information. -->
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col" th:text="#{title}"></th>
                    <th scope="col" th:text="#{description}"></th>
                    <th class="text-center" scope="col" th:text="#{status}"></th>
                </tr>
                </thead>
                <tbody th:if="${experiments.isEmpty()}">
                <tr>
                    <td colspan="4" th:text="#{table_empty}"></td>
                </tr>
                </tbody>
                <tbody th:unless="${experiments.isEmpty()}">
                <!--suppress ThymeleafVariablesResolveInspection -->
                <tr th:each="experimentProjection : ${experiments}"
                    th:with="experiment = ${experimentProjection.getExperiment()}">
                    <th scope="row">
                        <!--suppress ThymeleafVariablesResolveInspection -->
                        <a class="no_decoration" th:href="@{/experiment(id=${experiment.id})}"
                           th:text="${experiment.id}"></a>
                    </th>
                    <td>
                        <!--suppress ThymeleafVariablesResolveInspection -->
                        <a class="no_decoration" th:href="@{/experiment(id=${experiment.id})}"
                           th:text="${experiment.title}"></a>
                    </td>
                    <td>
                        <!--suppress ThymeleafVariablesResolveInspection -->
                        <a class="no_decoration" th:href="@{/experiment(id=${experiment.id})}"
                           th:text="${experiment.description}"></a>
                    </td>
                    <td class="text-center">
                        <!--suppress ThymeleafVariablesResolveInspection -->
                        <i aria-hidden="true" th:class="${experiment.active ? 'fas fa-eye' : 'fas fa-eye-slash'}"
                           title="Experiment active status"></i>
                        <!--suppress ThymeleafVariablesResolveInspection -->
                        <span class="visually-hidden" th:if="${experiment.active}" th:text="#{opened}"></span>
                        <!--suppress ThymeleafVariablesResolveInspection -->
                        <span class="visually-hidden" th:unless="${experiment.active}" th:text="#{closed}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
            <!-- The navigation elements below the table. -->
            <div class="text-center" th:unless="${experiments.isEmpty()}">
                <a id="experimentsFirst" class="btn btn-outline-dark"
                   th:style="${experimentPage <= 0 ? 'display:none' : ''}" th:aria-label="#{first_page_label}">
                    <i aria-hidden="true" class="fas fa-angle-double-left"></i>
                </a>
                <a id="experimentsPrev" class="btn btn-outline-dark"
                   th:style="${experimentPage <= 0 ? 'display:none' : ''}" th:aria-label="#{previous_page_label}">
                    <i aria-hidden="true" class="fas fa-angle-left"></i>
                </a>
                <a id="experimentsNext" class="btn btn-outline-dark"
                   th:style="${experimentPage >= lastExperimentPage ? 'display:none' : ''}"
                   th:aria-label="#{next_page_label}">
                    <i aria-hidden="true" class="fas fa-angle-right"></i>
                </a>
                <a id="experimentsLast" class="btn btn-outline-dark"
                   th:style="${experimentPage >= lastExperimentPage ? 'display:none' : ''}"
                   th:aria-label="#{last_page_label}">
                    <i aria-hidden="true" class="fas fa-angle-double-right"></i>
                </a>
            </div>
            <!-- The buttons for experiment management. -->
            <div class="d-flex gap-3 flex-wrap mt-4" th:if="${courseDTO.active}" sec:authorize="hasRole('ADMIN')">
                <div class="mb-3">
                    <a class="btn btn-secondary" th:href="@{/experiment/create(course=${courseDTO.id})}"
                       th:text="#{add_experiment}"></a>
                </div>
                <div class="mb-3">
                    <input id="openDeleteExperimentModal" type="submit" class="btn btn-danger"
                           th:value="#{delete_experiment}" th:unless="${experiments.isEmpty()}"/>
                </div>
            </div>
            <!-- Let Thymeleaf fetch the current and the last experiment page numbers. -->
            <script>
                var experimentPage = [[${experimentPage}]];
                var lastExperimentPage = [[${lastExperimentPage}]];
            </script>
        </div>
    </div>

    <!-- The course content information. -->
    <div class="card mt-5">
        <div class="card-header">
            <h5 class="mb-0" th:text="#{course_content}"></h5>
        </div>
        <div class="card-body">
            <div class="col-12" th:utext="${courseDTO.content}"></div>
        </div>
    </div>
</div>


<div id="deleteCourseModal" class="modal" sec:authorize="hasRole('ADMIN')">
    <div class="modal-content">
        <h2 th:text="#{delete_course}"></h2>
        <div class="mb-3" th:text="#{delete_course_warn}"></div>
        <form th:action="@{/course/delete}" th:object="${passwordDTO}" th:name="passwordDTO" method="post">
            <input type="hidden" name="id" th:value="${courseDTO.id}"/>
            <div class="col-12 mb-5 form-group position-relative">
                <label class="form-label" for="password" th:text="#{password}"></label>
                <div class="input-group">
                        <span class="input-group-text">
                            <i aria-hidden="true" class="fa fa-key" title="Enter password"></i>
                            <span class="visually-hidden" th:text="#{password}"></span>
                        </span>
                    <input th:name="password" id="password" type="password" th:placeholder="#{password}"
                           th:maxlength="${T(de.uni_passau.fim.se2.scratchlog.util.Constants).SMALL_FIELD}"
                           th:field="*{password}" th:class="${#fields.hasErrors('password')
                               ? 'form-control is-invalid' : 'form-control'}" required/>
                </div>
                <div class="validation" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="d-flex justify-content-between">
                <a id="abortDeleteCourse" class="btn btn-secondary" th:text="#{abort}"></a>
                <input class="btn btn-danger" type="submit" th:value="#{delete}">
            </div>
        </form>
    </div>
</div>

<!-- The popup dialog to stop the course. -->
<div id="stopCourseModal" class="modal" sec:authorize="hasRole('ADMIN')">
    <div class="modal-content">
        <h2 th:text="#{close_course}"></h2>
        <div class="mb-3" th:text="#{close_course_warn}"></div>
        <div class="d-flex justify-content-between">
            <input id="abortStopCourse" class="btn btn-secondary" type="submit" th:value="#{abort}">
            <a class="btn btn-danger" th:text="#{stop_course}" th:href="@{/course/status(id=${courseDTO.id},
            stat='close')}"></a>
        </div>
    </div>
</div>

<!-- The popup dialog to add an existing participant to the course. -->
<div id="addParticipantModal" class="modal" sec:authorize="hasRole('ADMIN')">
    <div class="modal-content">
        <h2 th:text="#{add_participant}"></h2>
        <div class="mb-3" th:text="#{add_course_participant_info}"></div>
        <form th:action="@{/course/participant/add}" th:method="POST">
            <div class="mb-3 form-group position-relative">
                <input id="addParticipantId" type="hidden" th:name="id" th:value="${courseDTO.id}">
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" th:name="add" id="experimentParticipant">
                    <label class="form-check-label" for="experimentParticipant" th:text="#{add_experiment_participant}">
                    </label>
                </div>
                <input type="text" id="participantInput" class="form-control"
                       th:maxlength="${T(de.uni_passau.fim.se2.scratchlog.util.Constants).LARGE_FIELD}">
            </div>
            <div class="list-group">
                <select multiple id="addParticipantsSelect" th:name="participants" class="d-none mb-3">
                </select>
            </div>
            <div class="d-flex justify-content-between">
                <a id="abortAddParticipant" class="btn btn-secondary" th:text="#{abort}"></a>
                <input class="btn btn-primary" type="submit" th:value="#{add}"/>
            </div>
        </form>
    </div>
</div>

<!-- The popup dialog to add existing users as participants through CSV. -->
<div id="addParticipantsCsvModal" class="modal" sec:authorize="hasRole('ADMIN')">
    <div class="modal-content">
        <h2 th:text="#{add_csv_participants}"></h2>
        <span th:text="#{csv_participants}" class="mb-3"></span>

        <form method="post" th:action="@{/course/participant/add-csv}" enctype="multipart/form-data">
            <input type="hidden" th:name="id" th:value="${courseDTO.id}">
            <div class="input-group">
                <input type="file" th:name="file" accept="text/csv">
            </div>
            <div class="d-flex justify-content-between mt-3">
                <a id="abortAddParticipantsCsv" class="btn btn-secondary" th:text="#{abort}"></a>
                <input type="submit" th:value="#{upload}" class="btn btn-primary">
            </div>
        </form>
    </div>
</div>

<!-- The popup dialog to delete a course participant. -->
<div id="deleteParticipantModal" class="modal" sec:authorize="hasRole('ADMIN')">
    <div class="modal-content">
        <h2 th:text="#{delete_participant}"></h2>
        <div class="mb-3" th:text="#{delete_course_participant_info}"></div>
        <form th:action="@{/course/participant/delete}">
            <div class="mb-3 form-group position-relative">
                <input id="deleteParticipantId" type="hidden" th:name="id" th:value="${courseDTO.id}">
                <div class="input-group">
                    <input class="form-control" type="text" id="deleteParticipantInput"
                           th:maxlength="${T(de.uni_passau.fim.se2.scratchlog.util.Constants).LARGE_FIELD}"/>
                </div>
            </div>
            <div class="list-group">
                <select multiple id="deleteParticipantsSelect" th:name="participants" class="d-none mb-3">
                </select>
            </div>
            <div class="d-flex justify-content-between">
                <a id="abortDeleteParticipant" class="btn btn-secondary" th:text="#{abort}"></a>
                <input class="btn btn-primary" type="submit" th:value="#{delete}"/>
            </div>
        </form>
    </div>
</div>

<!-- The popup dialog to remove an experiment. -->
<div id="deleteExperimentModal" class="modal" sec:authorize="hasRole('ADMIN')">
    <div class="modal-content">
        <h2 th:text="#{remove_experiment}"></h2>
        <div class="mb-3" th:text="#{remove_experiment_info}"></div>
        <form th:action="@{/course/experiment/delete}">
            <div class="mb-3 form-group position-relative">
                <input id="deleteExperimentsCourseId" type="hidden" th:name="id" th:value="${courseDTO.id}">
                <div class="input-group">
                    <input class="form-control" type="text" th:name="title" id="deleteExperimentsInput"
                           th:maxlength="${T(de.uni_passau.fim.se2.scratchlog.util.Constants).LARGE_FIELD}"/>
                </div>
            </div>
            <div class="list-group">
                <select multiple id="deleteExperimentsSelect" th:name="experimentTitles" class="d-none mb-3"></select>
            </div>
            <div class="d-flex justify-content-between">
                <a id="abortDeleteExperiment" class="btn btn-secondary" th:text="#{abort}"></a>
                <input class="btn btn-primary" type="submit" th:value="#{delete}"/>
            </div>
        </form>
    </div>
</div>

<!-- Script to update the experiment and course tables on user interactions with the respective button and also provide
participant/experiment suggestions within the modals. -->
<script type="module" th:src="@{/js/coursePage.js}"></script>

<!-- Let Thymeleaf fetch the ID of the current course. -->
<script>
    let courseId = [[${courseDTO.id}]];
</script>

<!-- Footer -->
<div th:insert="~{footer :: footer}"></div>
</body>
</html>
