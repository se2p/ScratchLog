<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{dashboard_title}"></title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/chart.js/dist/chart.umd.js}"></script>
</head>
<body>
<!-- Navigation bar -->
<header th:insert="~{header :: header}"></header>

<!-- Page content -->
<div class="container mt-4" sec:authorize="hasRole('ADMIN')">
    <div class="card">

        <!-- The page title and button to return to the experiment page. -->
        <div class="card-header">
            <h5 class="mb-0" th:text="#{dashboard_title}"></h5>
            <div>
                <a class="btn btn-secondary" th:href="@{/experiment(id=${experiment})}">
                    <span th:text="#{experiment_return}"></span>
                </a>
                <!--/*@thymesVar id="applicationConfig" type="de.uni_passau.fim.se2.scratchlog.util.ApplicationProperties"*/-->
                <a class="btn btn-secondary" th:if="${applicationConfig.codeEmbeddingsActive()}" th:href="@{/embedding-dashboard(id=${experiment})}">
                    <span th:text="#{embedding_dashboard}"></span>
                </a>
            </div>
        </div>

        <div class="card-body">
            <!-- The information about the number of participants who started and finished the experiment. -->
            <div class="row mb-3">
                <input type="hidden" name="id" th:value="${experiment}"/>
                <div class="col-6 p-4 text-center">
                    <div class="text-info">
                        <span class="display-3" id="started"></span>
                        <span class="display-6">/</span>
                        <span class="display-6" id="totalStarted"></span>
                    </div>
                    <div class="text-muted" th:text="#{participants_started}"></div>
                </div>
                <div class="col-6 p-4 text-center">
                    <div class="text-info">
                        <span class="display-3" id="finished"></span>
                        <span class="display-6">/</span>
                        <span class="display-6" id="totalFinished"></span>
                    </div>
                    <div class="text-muted" th:text="#{participants_finished}"></div>
                </div>
            </div>

            <!-- The information about the currently selected participants for whom statistics are shown. -->
            <div class="row mb-3">
                <div class="col-9" id="selectedParticipants">
                </div>
                <div class="col-3">
                    <label id="participantsLabel" class="form-label" for="participants" th:text="#{heading_participants}">
                    </label>
                    <select id="participants" class="form-select" th:aria-label="#{heading_participants}">
                        <option class="text"></option>
                    </select>
                </div>
            </div>

            <!-- The carousel for navigating through charts. -->
            <div id="chartsCarousel" class="carousel carousel-dark slide mb-5" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div id="blockEventCarouselItem" class="carousel-item active" data-bs-interval="600000">
                        <div class="mb-3 d-flex justify-content-between">
                            <div>
                                <span th:text="#{block_event}"></span>
                                <span id="blockEventChartDescription"></span>
                            </div>
                            <div>
                                <label class="form-label" for="blockEvents" th:text="#{block_events}"></label>
                                <div class="input-group">
                                    <select id="blockEvents" class="form-select" th:aria-label="#{block_events}"
                                            th:field="*{blockEvents}">
                                        <option th:each="event : ${blockEvents}"
                                                th:value="${event}" th:text="${event}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div id="blockEventChartNoData" class="text-muted no-data" th:text="#{no_data}"></div>
                        <div class="d-flex justify-content-center">
                            <canvas id="blockEventChart" role="img"
                                    aria-label="Chart displaying the number of block event executions per minute">
                            </canvas>
                        </div>
                    </div>
                    <div id="clickEventCarouselItem" class="carousel-item" data-bs-interval="6000000">
                        <div class="mb-3 d-flex justify-content-between">
                            <div>
                                <span th:text="#{click_event}"></span>
                                <span id="clickEventChartDescription"></span>
                            </div>
                            <div>
                                <label class="form-label" for="clickEvents" th:text="#{click_events}"></label>
                                <div class="input-group">
                                    <select id="clickEvents" class="form-select" th:aria-label="#{click_events}">
                                        <option th:each="event
                                        : ${T(de.uni_passau.fim.se2.scratchlog.util.enums.ClickEventSpecific).values()}"
                                                th:value="${event}" th:text="${event}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div id="clickEventChartNoData" class="text-muted no-data" th:text="#{no_data}"></div>
                        <div class="d-flex justify-content-center">
                            <canvas id="clickEventChart" style="display: none" role="img"
                                    aria-label="Chart displaying the number of click event executions per minute">
                            </canvas>
                        </div>
                    </div>
                    <div id="resourceEventCarouselItem" class="carousel-item" data-bs-interval="6000000">
                        <div class="mb-3 d-flex justify-content-between">
                            <div>
                                <span th:text="#{resource_event}"></span>
                                <span id="resourceEventChartDescription"></span>
                            </div>
                            <div>
                                <label class="form-label" for="resourceEvents" th:text="#{resource_event}"></label>
                                <div class="input-group">
                                    <select id="resourceEvents" class="form-select" th:aria-label="#{resource_events}">
                                        <option th:each="event
                                        : ${T(de.uni_passau.fim.se2.scratchlog.util.enums.ResourceEventSpecific).values()}"
                                                th:value="${event}" th:text="${event}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div id="resourceEventChartNoData" class="text-muted no-data" th:text="#{no_data}"></div>
                        <div class="d-flex justify-content-center">
                            <canvas id="resourceEventChart" style="display: none" role="img"
                                    aria-label="Chart displaying the number of resource event executions per minute">
                            </canvas>
                        </div>
                    </div>
                    <div id="radarEventCarouselItem" class="carousel-item" data-bs-interval="6000000">
                        <div id="radarEventChartNoData" class="text-muted no-data" th:text="#{no_data}"></div>
                        <div class="d-flex justify-content-center">
                            <canvas id="radarEventChart" style="display: none"
                                    aria-label="Radar chart displaying the number of certain event executions per minute"
                                    role="img">
                            </canvas>
                        </div>
                    </div>
                </div>
                <button id="carouselPrev" class="carousel-control-prev" type="button" data-bs-target="#chartsCarousel"
                        data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button id="carouselNext" class="carousel-control-next" type="button" data-bs-target="#chartsCarousel"
                        data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

            <!-- The line charts displayed below the carousel. -->
            <div class="row mb-3">
                <div class="col-6">
                    <div class="panel-body">
                        <div id="chart1NoData" class="text-muted text-center" th:text="#{no_data}"></div>
                        <div class="d-flex justify-content-center">
                            <canvas id="chart1" style="display: none" role="img">
                            </canvas>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="panel-body">
                        <div id="chart2NoData" class="text-muted text-center" th:text="#{no_data}"></div>
                        <div class="d-flex justify-content-center">
                            <canvas id="chart2" style="display: none" role="img">
                            </canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-3"></div>
                <div class="col-6">
                    <div class="panel-body">
                        <div id="chart3NoData" class="text-muted text-center" th:text="#{no_data}"></div>
                        <div class="d-flex justify-content-center">
                            <canvas id="chart3" style="display: none" role="img">
                            </canvas>
                        </div>
                    </div>
                </div>
                <div class="col-3"></div>
            </div>
        </div>

    </div>
</div>

<!-- Script to fetch and update the dashboard information. -->
<script type="module" th:src="@{/js/dashboard.js}"></script>

<!-- Let Thymeleaf fetch the ID of the current experiment and the events for which information should be fetched
initially. -->
<script th:inline="javascript">
    let experimentId = [[${experiment}]];
    let blockEvent = [[${blockEvent}]];
    let clickEvent = [[${clickEvent}]];
    let resourceEvent = [[${resourceEvent}]];
    let radarValues = [[${radarValues}]];
</script>

<!-- Footer -->
<div th:insert="~{footer :: footer}"></div>
</body>
</html>
